#questo file è stato creato per mantenere l'archittura vecchia con cui si eseguiva il task_node con ros2 run anziché launch file
#in un'implementazione futura si potrà eliminare e usare direttamente il launch file shot_planning_launch.py

task_node:
  ros__parameters:

    # Sezione per MoveIt (nell'URDF di ur_description non ci sono i limiti d'accelerazione che fanno fallire alcuni metodi)
    # bisogna ripassare qui la robot description con i limiti di velocità e accelerazione dei giunti, altrimenti MoveIt non li conosce e fallisce alcuni metodi di pianificazione
    robot_description_kinematics:
      arm:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.005

    robot_description_planning:
      joint_limits:
        elbow_joint:
          has_velocity_limits: true
          max_velocity: 3.14159265
          has_acceleration_limits: true
          max_acceleration: 6.98131700
        shoulder_lift_joint:
          has_velocity_limits: true
          max_velocity: 3.14159265
          has_acceleration_limits: true
          max_acceleration: 6.98131700
        shoulder_pan_joint:
          has_velocity_limits: true
          max_velocity: 3.14159265
          has_acceleration_limits: true
          max_acceleration: 6.98131700
        wrist_1_joint:
          has_velocity_limits: true
          max_velocity: 3.14159265
          has_acceleration_limits: true
          max_acceleration: 6.98131700
        wrist_2_joint:
          has_velocity_limits: true
          max_velocity: 3.14159265
          has_acceleration_limits: true
          max_acceleration: 6.98131700
        wrist_3_joint:
          has_velocity_limits: true
          max_velocity: 3.14159265
          has_acceleration_limits: true
          max_acceleration: 6.98131700

